name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install ffmpeg and require ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          command -v ffprobe
          ffprobe -version
      - name: Require Docker for Testcontainers
        run: docker info
      - name: Build and test with Testcontainers
        run: bash ./mvnw -B -Dpeergeek.require-docker=true verify
        working-directory: backend
