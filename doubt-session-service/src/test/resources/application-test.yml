server:
  port: 0

spring:
  application:
    name: doubt-session-service-test
  datasource:
    url: jdbc:h2:mem:doubt_session_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

peergeek:
  auth:
    jwt-secret: development-only-peergeek-jwt-secret-replace-before-production
  gateway:
    shared-secret: pg-internal-gateway-secret-2026
  livekit:
    url: http://localhost:7880
    api-key: devkey
    api-secret: secret
  wallet:
    service-url: http://localhost:8088
  course-learning:
    service-url: http://localhost:8090
  outbox:
    relay-interval-ms: 60000

