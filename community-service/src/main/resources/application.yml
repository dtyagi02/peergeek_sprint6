server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: community-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${COMMUNITY_MYSQL_DATABASE:${MYSQL_DATABASE:peergeek_community}}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:achintyaC%02}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: community-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      missing-topics-fatal: false

peergeek:
  auth:
    jwt-secret: ${PEERGEEK_AUTH_JWTSECRET:dev_jwt_secret_must_be_at_least_32_characters_long_for_hmac}
  gateway:
    shared-secret: ${PEERGEEK_GATEWAY_SHARED_SECRET:pg-internal-gateway-secret-2026}
  migration:
    monolith-db: ${MONOLITH_DATABASE:peergeek}
    auto-migrate-historical-data: ${AUTO_MIGRATE_COMMUNITY_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

