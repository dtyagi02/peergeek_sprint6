server:
  port: 0

spring:
  application:
    name: community-service-test
  datasource:
    url: jdbc:h2:mem:community_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

peergeek:
  auth:
    jwt-secret: dev_jwt_secret_must_be_at_least_32_characters_long_for_hmac
  gateway:
    shared-secret: pg-internal-gateway-secret-2026
  migration:
    monolith-db: peergeek
    auto-migrate-historical-data: false

