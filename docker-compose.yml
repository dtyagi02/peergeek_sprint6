services:
  mysql:
    image: mysql:8.4.5
    command: --max_allowed_packet=16M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.2.28-debian-12-r0
    command: /opt/bitnami/scripts/minio/run.sh
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mc alias set local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null && mc ready local',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: bitnamilegacy/minio:2025.2.28-debian-12-r0
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
    restart: "no"
    healthcheck:
      test: ["CMD", "mc", "--version"]
      interval: 5s
      timeout: 3s
      retries: 2

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["monolith-legacy"]
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?Set STORAGE_ENDPOINT in .env}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:?Set STORAGE_REGION in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Set STORAGE_BUCKET in .env}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:?Set STORAGE_PATH_STYLE in .env}
      STORAGE_CREATE_BUCKET_IF_MISSING: ${STORAGE_CREATE_BUCKET_IF_MISSING:-true}
      PEERGEEK_RESOURCES_MAXPDFBYTES: ${PEERGEEK_RESOURCES_MAXPDFBYTES:-52428800}
      PEERGEEK_RESOURCES_MAXDOCUMENTBYTES: ${PEERGEEK_RESOURCES_MAXDOCUMENTBYTES:-52428800}
      PEERGEEK_RESOURCES_MAXIMAGEBYTES: ${PEERGEEK_RESOURCES_MAXIMAGEBYTES:-10485760}
      PEERGEEK_RESOURCES_MAXTHUMBNAILBYTES: ${PEERGEEK_RESOURCES_MAXTHUMBNAILBYTES:-5242880}
      PEERGEEK_RESOURCES_MAXVIDEOBYTES: ${PEERGEEK_RESOURCES_MAXVIDEOBYTES:-1073741824}
      PEERGEEK_RESOURCES_MAXRESOURCESPERLESSON: ${PEERGEEK_RESOURCES_MAXRESOURCESPERLESSON:-50}
      PEERGEEK_RESOURCES_PUTURLTTL: ${PEERGEEK_RESOURCES_PUTURLTTL:-15m}
      PEERGEEK_RESOURCES_GETURLTTL: ${PEERGEEK_RESOURCES_GETURLTTL:-5m}
      PEERGEEK_RESOURCES_ABANDONEDUPLOADAGE: ${PEERGEEK_RESOURCES_ABANDONEDUPLOADAGE:-24h}
      PEERGEEK_RESOURCES_DELETEDRESOURCEGRACE: ${PEERGEEK_RESOURCES_DELETEDRESOURCEGRACE:-1h}
      PEERGEEK_RESOURCES_STUCKPROCESSINGAGE: ${PEERGEEK_RESOURCES_STUCKPROCESSINGAGE:-15m}
      PEERGEEK_RESOURCES_CLEANUPINTERVAL: ${PEERGEEK_RESOURCES_CLEANUPINTERVAL:-15m}
      PEERGEEK_RESOURCES_MAXPROCESSINGATTEMPTS: ${PEERGEEK_RESOURCES_MAXPROCESSINGATTEMPTS:-3}
      PEERGEEK_RESOURCES_PROCESSINGTHREADS: ${PEERGEEK_RESOURCES_PROCESSINGTHREADS:-2}
      PEERGEEK_RESOURCES_PROCESSINGQUEUECAPACITY: ${PEERGEEK_RESOURCES_PROCESSINGQUEUECAPACITY:-32}
      PEERGEEK_RESOURCES_MAXOOXMLEXPANDEDBYTES: ${PEERGEEK_RESOURCES_MAXOOXMLEXPANDEDBYTES:-67108864}
      PEERGEEK_RESOURCES_ALLOWEDPDFMIMETYPES: ${PEERGEEK_RESOURCES_ALLOWEDPDFMIMETYPES:-application/pdf}
      PEERGEEK_RESOURCES_ALLOWEDDOCUMENTMIMETYPES: ${PEERGEEK_RESOURCES_ALLOWEDDOCUMENTMIMETYPES:-application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,text/csv}
      PEERGEEK_RESOURCES_ALLOWEDIMAGEMIMETYPES: ${PEERGEEK_RESOURCES_ALLOWEDIMAGEMIMETYPES:-image/png,image/jpeg,image/webp,image/gif}
      PEERGEEK_RESOURCES_ALLOWEDVIDEOMIMETYPES: ${PEERGEEK_RESOURCES_ALLOWEDVIDEOMIMETYPES:-video/mp4,video/webm}
      PEERGEEK_RESOURCES_ALLOWEDPDFMAPPINGS: ${PEERGEEK_RESOURCES_ALLOWEDPDFMAPPINGS:-pdf=application/pdf}
      PEERGEEK_RESOURCES_ALLOWEDDOCUMENTMAPPINGS: ${PEERGEEK_RESOURCES_ALLOWEDDOCUMENTMAPPINGS:-docx=application/vnd.openxmlformats-officedocument.wordprocessingml.document,pptx=application/vnd.openxmlformats-officedocument.presentationml.presentation,xlsx=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,txt=text/plain,csv=text/csv}
      PEERGEEK_RESOURCES_ALLOWEDIMAGEMAPPINGS: ${PEERGEEK_RESOURCES_ALLOWEDIMAGEMAPPINGS:-png=image/png,jpg=image/jpeg,jpeg=image/jpeg,webp=image/webp,gif=image/gif}
      PEERGEEK_RESOURCES_ALLOWEDVIDEOMAPPINGS: ${PEERGEEK_RESOURCES_ALLOWEDVIDEOMAPPINGS:-mp4=video/mp4,webm=video/webm}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET:?Set PEERGEEK_AUTH_JWTSECRET in .env}
      PEERGEEK_AUTH_ACCESSTOKENTTLSECONDS: ${PEERGEEK_AUTH_ACCESSTOKENTTLSECONDS:-900}
      PEERGEEK_AUTH_REFRESHTOKENTTLDAYS: ${PEERGEEK_AUTH_REFRESHTOKENTTLDAYS:-14}
      PEERGEEK_AUTH_RESETOTPTTLMINUTES: ${PEERGEEK_AUTH_RESETOTPTTLMINUTES:-10}
      PEERGEEK_AUTH_RESETOTPCOOLDOWNSECONDS: ${PEERGEEK_AUTH_RESETOTPCOOLDOWNSECONDS:-60}
      PEERGEEK_AUTH_REFRESHCOOKIESECURE: ${PEERGEEK_AUTH_REFRESHCOOKIESECURE:-false}
      PEERGEEK_COURSE_MINIMUMTITLELENGTH: ${PEERGEEK_COURSE_MINIMUMTITLELENGTH:-3}
      PEERGEEK_COURSE_MAXIMUMTITLELENGTH: ${PEERGEEK_COURSE_MAXIMUMTITLELENGTH:-120}
      PEERGEEK_COURSE_MAXIMUMDESCRIPTIONLENGTH: ${PEERGEEK_COURSE_MAXIMUMDESCRIPTIONLENGTH:-5000}
      PEERGEEK_COURSE_MAXIMUMTOPICS: ${PEERGEEK_COURSE_MAXIMUMTOPICS:-10}
      PEERGEEK_COURSE_MINIMUMTOPICLENGTH: ${PEERGEEK_COURSE_MINIMUMTOPICLENGTH:-2}
      PEERGEEK_COURSE_MAXIMUMTOPICLENGTH: ${PEERGEEK_COURSE_MAXIMUMTOPICLENGTH:-40}
      PEERGEEK_COURSE_MAXIMUMMODULETITLELENGTH: ${PEERGEEK_COURSE_MAXIMUMMODULETITLELENGTH:-120}
      PEERGEEK_COURSE_MAXIMUMMODULEDESCRIPTIONLENGTH: ${PEERGEEK_COURSE_MAXIMUMMODULEDESCRIPTIONLENGTH:-1000}
      PEERGEEK_COURSE_MAXIMUMMODULESPERCOURSE: ${PEERGEEK_COURSE_MAXIMUMMODULESPERCOURSE:-200}
      PEERGEEK_COURSE_MAXIMUMLESSONTITLELENGTH: ${PEERGEEK_COURSE_MAXIMUMLESSONTITLELENGTH:-150}
      PEERGEEK_COURSE_MAXIMUMLESSONSUMMARYLENGTH: ${PEERGEEK_COURSE_MAXIMUMLESSONSUMMARYLENGTH:-500}
      PEERGEEK_COURSE_MAXIMUMLESSONSPERMODULE: ${PEERGEEK_COURSE_MAXIMUMLESSONSPERMODULE:-500}
      PEERGEEK_COURSE_MAXIMUMCONTENTJSONBYTES: ${PEERGEEK_COURSE_MAXIMUMCONTENTJSONBYTES:-2097152}
      PEERGEEK_COURSE_MAXIMUMCONTENTDEPTH: ${PEERGEEK_COURSE_MAXIMUMCONTENTDEPTH:-20}
      PEERGEEK_BOOTSTRAP_ADMIN_EMAIL: ${PEERGEEK_BOOTSTRAP_ADMIN_EMAIL:-}
      PEERGEEK_BOOTSTRAP_ADMIN_PASSWORD: ${PEERGEEK_BOOTSTRAP_ADMIN_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      PEERGEEK_MAIL_FROM: ${PEERGEEK_MAIL_FROM:-no-reply@peergeek.local}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-http://wallet-payment-service:8088}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-peergeek-internal-gateway-secret-key-change-in-prod}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      GATEWAY_PORT: 8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      WALLET_SERVICE_URL: http://wallet-payment-service:8088
      COMMUNITY_SERVICE_URL: http://community-service:8089
      COMMUNITY_WS_URL: ws://community-service:8089
      COURSE_LEARNING_SERVICE_URL: http://course-learning-assessment-service:8090
      IDENTITY_SERVICE_URL: http://identity-service:8091
      DOUBT_SESSION_SERVICE_URL: http://doubt-session-service:8092
      REFERRAL_SERVICE_URL: http://referral-service:8093
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-pg-internal-gateway-secret-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${GATEWAY_PORT:-8081}:8081"
    depends_on:
      notification-service:
        condition: service_healthy
      wallet-payment-service:
        condition: service_healthy
      community-service:
        condition: service_healthy
      course-learning-assessment-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      doubt-session-service:
        condition: service_healthy
      referral-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-service:
    build:
      context: ./notification-service
    environment:
      SERVER_PORT: 8087
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_notification
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-peergeek_dev}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-peergeek_pass}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
    ports:
      - "${NOTIFICATION_PORT:-8087}:8087"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8087/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  wallet-payment-service:
    build:
      context: ./wallet-payment-service
    environment:
      SERVER_PORT: 8088
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_wallet
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-peergeek-internal-gateway-secret-key-change-in-prod}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: INR
      APP_MIGRATION_WALLET_HISTORICAL_ENABLED: ${APP_MIGRATION_WALLET_HISTORICAL_ENABLED:-true}
    ports:
      - "${WALLET_PORT:-8088}:8088"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8088/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  community-service:
    build:
      context: ./community-service
    environment:
      SERVER_PORT: 8089
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_community
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-peergeek-internal-gateway-secret-key-change-in-prod}
      AUTO_MIGRATE_COMMUNITY_DATA: ${AUTO_MIGRATE_COMMUNITY_DATA:-true}
    ports:
      - "${COMMUNITY_PORT:-8089}:8089"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8089/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  course-learning-assessment-service:
    build:
      context: ./course-learning-assessment-service
    environment:
      SERVER_PORT: 8090
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_learning
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-peergeek-internal-gateway-secret-key-change-in-prod}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-peergeek}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
    ports:
      - "${COURSE_PORT:-8090}:8090"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  identity-service:
    build:
      context: ./identity-service
    environment:
      SERVER_PORT: 8091
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_identity
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-peergeek-internal-gateway-secret-key-change-in-prod}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-peergeek}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      SPRING_MAIL_HOST: ${MAILPIT_HOST:-mailpit}
      SPRING_MAIL_PORT: 1025
    ports:
      - "${IDENTITY_PORT:-8091}:8091"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  doubt-session-service:
    build:
      context: ./doubt-session-service
    environment:
      SERVER_PORT: 8092
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_doubt_session
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-peergeek-internal-gateway-secret-key-change-in-prod}
      WALLET_SERVICE_URL: http://wallet-service:8088
      COURSE_LEARNING_SERVICE_URL: http://course-learning-assessment-service:8090
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - "${DOUBT_SESSION_PORT:-8092}:8092"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8092/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  referral-service:
    build:
      context: ./referral-service
    environment:
      SERVER_PORT: 8093
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: peergeek_referral
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PEERGEEK_AUTH_JWTSECRET: ${PEERGEEK_AUTH_JWTSECRET}
      INTERNAL_GATEWAY_SECRET: ${GATEWAY_SHARED_SECRET:-pg-internal-gateway-secret-2026}
      WALLET_SERVICE_URL: http://wallet-payment-service:8088
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      IDENTITY_SERVICE_URL: http://identity-service:8091
    ports:
      - "${REFERRAL_PORT:-8093}:8093"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8093/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-peergeek_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-peergeek_pass}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql-data:
  redis-data:
  minio-data:
  frontend-node-modules:
  kafka-data:
  rabbitmq-data:
