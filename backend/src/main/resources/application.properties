spring.application.name=peergeek-backend
spring.profiles.default=dev
spring.mvc.throw-exception-if-no-handler-found=true

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:peergeek}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:achintyaC%02}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

peergeek.app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
peergeek.redis.host=${REDIS_HOST:localhost}
peergeek.redis.port=${REDIS_PORT:6379}
peergeek.redis.connect-timeout=1s
peergeek.redis.command-timeout=1s
peergeek.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
peergeek.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
peergeek.storage.region=${STORAGE_REGION:us-east-1}
peergeek.storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
peergeek.storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
peergeek.storage.bucket=${STORAGE_BUCKET:peergeek}
peergeek.storage.path-style=${STORAGE_PATH_STYLE:true}
peergeek.storage.create-bucket-if-missing=${STORAGE_CREATE_BUCKET_IF_MISSING:true}

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=db,objectStorage
management.endpoint.health.group.liveness.include=livenessState
management.info.env.enabled=true
info.app.name=PeerGeek
info.app.phase=0

readiness.report.max-age=${READINESS_REPORT_MAX_AGE:24h}
readiness.report.max-issues=${READINESS_REPORT_MAX_ISSUES:500}
readiness.report.course-description-warning-min-length=${READINESS_REPORT_COURSE_DESCRIPTION_WARNING_MIN_LENGTH:50}
readiness.runs.timeout=${READINESS_RUNS_TIMEOUT:10m}
readiness.runs.course-cooldown=${READINESS_RUNS_COURSE_COOLDOWN:10s}
readiness.runs.max-concurrent-per-user=${READINESS_RUNS_MAX_CONCURRENT_PER_USER:3}
readiness.runs.threads=${READINESS_RUNS_THREADS:4}
readiness.runs.queue-capacity=${READINESS_RUNS_QUEUE_CAPACITY:32}
readiness.runs.retention-per-course=${READINESS_RUNS_RETENTION_PER_COURSE:10}
readiness.integrity.max-rehash-bytes=${READINESS_INTEGRITY_MAX_REHASH_BYTES:52428800}
readiness.video.probe-required=${READINESS_VIDEO_PROBE_REQUIRED:true}
readiness.video.timeout=${READINESS_VIDEO_TIMEOUT:30s}
readiness.pdf.max-bytes=${READINESS_PDF_MAX_BYTES:52428800}
readiness.ooxml.max-entries=${READINESS_OOXML_MAX_ENTRIES:10000}
readiness.ooxml.max-expanded-bytes=${READINESS_OOXML_MAX_EXPANDED_BYTES:67108864}
readiness.ooxml.max-compression-ratio=${READINESS_OOXML_MAX_COMPRESSION_RATIO:100}
readiness.image.max-pixels=${READINESS_IMAGE_MAX_PIXELS:50000000}
readiness.links.cache-ttl=${READINESS_LINKS_CACHE_TTL:15m}
readiness.links.allow-private-hosts=${READINESS_LINKS_ALLOW_PRIVATE_HOSTS:false}
readiness.links.allowed-ports=${READINESS_LINKS_ALLOWED_PORTS:80,443}
readiness.links.connect-timeout=${READINESS_LINKS_CONNECT_TIMEOUT:3s}
readiness.links.total-timeout=${READINESS_LINKS_TOTAL_TIMEOUT:8s}
readiness.links.max-redirects=${READINESS_LINKS_MAX_REDIRECTS:3}
readiness.links.max-concurrent=${READINESS_LINKS_MAX_CONCURRENT:8}
readiness.links.max-concurrent-per-host=${READINESS_LINKS_MAX_CONCURRENT_PER_HOST:2}

springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

discovery.dirty-flush=${DISCOVERY_DIRTY_FLUSH:5s}
discovery.reconcile-interval=${DISCOVERY_RECONCILE_INTERVAL:5m}
discovery.max-offset=${DISCOVERY_MAX_OFFSET:1000}
discovery.popular.size=${DISCOVERY_POPULAR_SIZE:12}
discovery.stats.min-completion-sample=${DISCOVERY_STATS_MIN_COMPLETION_SAMPLE:10}
discovery.cache.preview-ttl=${DISCOVERY_CACHE_PREVIEW_TTL:10m}
discovery.cache.popular-ttl=${DISCOVERY_CACHE_POPULAR_TTL:2m}
discovery.cache.categories-ttl=${DISCOVERY_CACHE_CATEGORIES_TTL:10m}


peergeek.referral.inviter-reward=${REFERRAL_INVITER_REWARD:100.00}
peergeek.referral.new-user-reward=${REFERRAL_NEW_USER_REWARD:50.00}
peergeek.referral.expiry-days=${REFERRAL_EXPIRY_DAYS:7}
peergeek.referral.max-invitations-per-day=${REFERRAL_MAX_INVITATIONS_PER_DAY:20}
peergeek.referral.base-url=${FRONTEND_URL:http://localhost:5173}
peergeek.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

# Razorpay Payment Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.enabled=${RAZORPAY_ENABLED:true}
peergeek.razorpay.key-id=${RAZORPAY_KEY_ID:}
peergeek.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
peergeek.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
peergeek.razorpay.enabled=${RAZORPAY_ENABLED:true}

# Apache Kafka (KRaft mode event bus)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
peergeek.outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:3000}

# Microservice Client Configurations
wallet.service.url=${WALLET_SERVICE_URL:http://localhost:8088}
wallet.service.internal-secret=${INTERNAL_GATEWAY_SECRET:${PEERGEEK_GATEWAY_SHARED_SECRET:pg-internal-gateway-secret-2026}}
wallet.service.remote-enabled=${WALLET_SERVICE_REMOTE_ENABLED:true}


