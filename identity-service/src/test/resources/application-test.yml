server:
  port: 0

spring:
  application:
    name: identity-service-test
  datasource:
    url: jdbc:h2:mem:identity_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: localhost
    port: 1025

peergeek:
  auth:
    jwt-secret: development-only-peergeek-jwt-secret-replace-before-production
    access-token-ttl-seconds: 900
    refresh-token-ttl-days: 14
    reset-otp-ttl-minutes: 10
    reset-otp-cooldown-seconds: 60
    refresh-cookie-secure: false
  gateway:
    shared-secret: pg-internal-gateway-secret-2026
  storage:
    endpoint: http://localhost:9000
    public-endpoint: http://localhost:9000
    region: us-east-1
    access-key: minioadmin
    secret-key: minioadmin
    bucket: peergeek
    path-style: true
  outbox:
    relay-interval-ms: 60000

